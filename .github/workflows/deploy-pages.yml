# Publishes the site to GitHub Pages.
#
# This runs the deploy from inside Actions rather than configuring Pages through
# the REST API, because `configure-pages` can enable Pages itself on the first
# run (enablement: true) using the workflow's own token. There is no build step:
# the repository root is uploaded as-is.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/marketing-info-website-35ijih]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on the first run if it does not exist yet.
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          # Static site, no build step — ship the repository root.
          # The action already excludes .git and .github.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
